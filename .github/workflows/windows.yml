name: Windows preflight

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Python regression tests without external API calls
        run: |
          foreach ($test in @('radar', 'freshness', 'vertex', 'web', 'community')) {
            python "test_$test.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: UI regression tests
        run: node test_web_ui.mjs
      - name: Windows PowerShell scripts
        shell: powershell
        run: .\test_windows.ps1
