<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore repositories | RepoBite</title>
<style>
:root{font:15px Inter,-apple-system,sans-serif;color:#f5f5f6;background:#09090b}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#09090b}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.rail{width:72px;flex:0 0 72px;padding:16px;border-right:1px solid #27272a}.mark{font-size:24px}.layout{display:flex;min-width:0;flex:1}.main{min-width:0;flex:1}.bar{display:flex;gap:8px;padding:20px 32px;position:sticky;top:0;background:#09090bf2;z-index:2}.sort,.chip,input{height:40px;border:1px solid #27272a;border-radius:12px;background:#09090b;color:#f5f5f6}.sort{width:144px;padding:0 12px}.chips{display:flex;gap:8px;overflow:auto}.chip{padding:0 14px;white-space:nowrap}.chip[aria-pressed=true]{background:#fafafa;border-color:#fafafa;color:#111}.feed{padding:8px 32px 32px;columns:3;column-gap:32px}.card{width:100%;margin:0 0 32px;padding:0;border:0;background:none;color:inherit;text-align:left;break-inside:avoid}.card[aria-pressed=true] .preview{outline:2px solid #fafafa;outline-offset:3px}.preview{position:relative;display:grid;min-height:230px;overflow:hidden;border:1px solid #27272a;border-radius:12px;background:#18181b}.preview>img,.fallback{grid-area:1/1}.preview>img{width:100%;height:100%;object-fit:cover}.preview>img.social,.preview>img.wide{height:auto;align-self:center;object-fit:contain}.fallback{align-self:center;justify-self:center;max-width:80%;color:#a1a1aa;font-size:18px;font-weight:700;overflow-wrap:anywhere;text-align:center}.stats{position:absolute;bottom:12px;left:12px;margin:0;padding:8px 10px;border:1px solid #27272a;border-radius:8px;background:#09090be8;font:11px monospace}.dot{display:inline-block;width:7px;height:7px;margin:0 4px 0 8px;border-radius:50%}.dot:first-child{margin-left:0}.e{background:#4ade80}.m{background:#facc15}.h{background:#fb7185}.meta{display:flex;gap:10px;padding-top:12px}.avatar{width:28px;height:28px;border:1px solid #27272a;border-radius:50%}.repo,.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo{font-weight:700}.title,.sub,.note{color:#a1a1aa;font-size:13px}.side{position:sticky;top:0;width:360px;height:100vh;overflow-y:auto;flex:0 0 360px;border-left:1px solid #27272a}.search{display:block;padding:20px 32px}.search input{width:100%;padding:0 14px}.panel{padding:0 32px 32px}.head{display:flex;justify-content:space-between;align-items:center}.head button{border:0;background:none;color:#a1a1aa}.issues{padding:0;list-style:none}.issues li{display:flex;gap:12px;padding:12px 0}.time{width:42px;color:#71717a;font:11px monospace}.copy{min-width:0}.copy a{display:block;overflow:hidden;color:#f5f5f6;font-weight:650;text-decoration:none;text-overflow:ellipsis;white-space:nowrap}.copy a:hover{text-decoration:underline}.reason{margin:5px 0 0;color:#a1a1aa;font-size:12px;line-height:1.45}.empty{color:#a1a1aa;padding:24px 0}@media(max-width:1199px){.side{display:none}}@media(max-width:900px){.feed{columns:2}}@media(max-width:767px){.rail{display:none}.bar{padding:12px}.feed{padding:8px 12px;columns:1}}
</style></head><body><div class="app"><nav class="rail" aria-label="주요 메뉴"><div class="mark" aria-label="RepoBite">◎</div></nav><div class="layout"><main class="main"><h1 hidden>오픈소스 레포지토리 탐색</h1><div class="bar"><select id="sort" class="sort" aria-label="정렬"><option value="recommended">추천순</option><option value="recent">최근 이슈순</option><option value="name">레포 이름순</option></select><div class="chips"><button class="chip" data-filter="" aria-pressed="true">전체 <span id="count">0</span></button><button class="chip" data-filter="ai-ml agents-automation">AI</button><button class="chip" data-filter="web-framework ui-design-system backend-api">프레임워크</button><button class="chip" data-filter="database search-knowledge">데이터</button><button class="chip" data-filter="dev-tools ide-terminal testing-quality cicd-release">개발 도구</button><button class="chip" data-filter="infra-cloud observability networking-systems">인프라</button><button class="chip" data-filter="security-identity">보안</button><button class="chip" data-filter="desktop-app mobile productivity">앱</button><button class="chip" data-filter="media-creative games-graphics">미디어</button></div></div><section id="feed" class="feed" aria-label="레포지토리"></section></main><aside class="side"><label class="search"><input id="search" type="search" placeholder="Search repositories..." aria-label="레포지토리 검색"></label><section class="panel"><div class="head"><h2 id="heading">Recent issues</h2><button id="clear" hidden>전체 보기</button></div><ul id="issues" class="issues"></ul><p class="note">수집과 판정 결과를 바탕으로 레포와 이슈를 탐색합니다.</p></section></aside></div></div>
<script>
const $=id=>document.getElementById(id),make=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};let state={items:[]},tags=[],selected='',query='',sort='recommended';const good=x=>x.grade&&!x.grade.exclude&&x.grade.difficulty===1&&x.grade.readiness==='ready'&&x.freshness?.eligible;
function repos(){let m=new Map;state.items.forEach(x=>{if(!m.has(x.repo))m.set(x.repo,{...x,issues:[]});m.get(x.repo).issues.push(x)});return [...m.values()].filter(x=>(!tags.length||x.categories.some(t=>tags.includes(t)))&&(x.repo+' '+x.description).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>sort==='name'?a.repo.localeCompare(b.repo):sort==='recent'?new Date(b.issues[0].created_at)-new Date(a.issues[0].created_at):b.issues.filter(good).length-a.issues.filter(good).length)}
function cards(){let list=repos(),feed=$('feed');$('count').textContent=new Set(state.items.map(x=>x.repo)).size;feed.replaceChildren();if(!list.length)return feed.append(make('p','empty','일치하는 레포가 없습니다.'));list.forEach(r=>{let b=make('button','card');b.type='button';b.dataset.repo=r.repo;b.setAttribute('aria-pressed',r.repo===selected);let owner=r.repo.split('/')[0],p=make('div','preview'),fallback=make('span','fallback',r.repo),social='https://opengraph.githubassets.com/1/'+r.repo,img=make('img',r.repository_image?'':'social');fallback.hidden=true;img.src=r.repository_image||social;img.alt=r.repo+' 대표 이미지';img.onload=()=>requestAnimationFrame(()=>img.classList.toggle('wide',img.naturalWidth*p.clientHeight>img.naturalHeight*p.clientWidth));img.onerror=()=>{if(!img.classList.contains('social')){img.className='social';img.src=social}else{img.hidden=true;fallback.hidden=false}};p.append(fallback,img);let levels=[1,2,3].map(n=>r.issues.filter(x=>x.grade?.difficulty===n).length),stats=make('p','stats');stats.setAttribute('aria-label','쉬움 '+levels[0]+', 중간 '+levels[1]+', 어려움 '+levels[2]);[['e',0],['m',1],['h',2]].forEach(([c,n])=>stats.append(make('span','dot '+c),document.createTextNode(levels[n])));p.append(stats);let meta=make('div','meta'),av=make('img','avatar');av.src='https://avatars.githubusercontent.com/'+owner+'?v=4&s=128';av.alt='';av.onerror=()=>av.hidden=true;meta.append(av);let text=make('p');text.append(make('span','repo',r.repo),make('span','title',r.description));meta.append(text);b.append(p,meta);b.onclick=()=>{selected=selected===r.repo?'':r.repo;feed.querySelectorAll('.card').forEach(x=>x.setAttribute('aria-pressed',x.dataset.repo===selected));issues()};feed.append(b)})}
function issues(){let rows=selected?state.items.filter(x=>x.repo===selected):[...state.items].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);$('heading').textContent=selected||'Recent issues';$('clear').hidden=!selected;$('issues').replaceChildren();rows.forEach(x=>{let li=make('li'),time=make('span','time',new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'}).format(new Date(x.created_at))),copy=make('div','copy'),a=make('a','',x.title);a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';copy.append(a,make('span','sub',x.repo+' #'+x.number));if(x.grade?.reason)copy.append(make('p','reason',x.grade.reason));li.append(time,copy);$('issues').append(li)});if(!rows.length)$('issues').append(make('li','empty','표시할 이슈가 없습니다.'))}
async function refresh(){let r=await fetch('/data.json'),d=await r.json();if(!r.ok)throw Error(d.error);state=d;cards();issues()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{tags=b.dataset.filter.split(' ').filter(Boolean);selected='';document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));cards();issues()});$('search').oninput=e=>{query=e.target.value;selected='';cards();issues()};$('sort').onchange=e=>{sort=e.target.value;cards()};$('clear').onclick=()=>{selected='';cards();issues()};refresh().catch(e=>$('feed').append(make('p','empty',e.message)));
</script></body></html>
