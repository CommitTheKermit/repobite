<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepoBite</title>


<link rel="stylesheet" href="/repobite.css">
</head>
<body>
<div class="shell" inert>
  <nav class="rail" aria-label="주요 메뉴">
    <a class="mark" href="#/explore" aria-label="RepoBite 메인으로"><canvas data-dither="logo" width="20" height="20" aria-hidden="true"></canvas></a>
    <a class="nav-item" href="#/explore" data-nav="explore" aria-label="탐색"><canvas data-dither="compass" width="20" height="20" aria-hidden="true"></canvas><span>explore</span></a>
    <a class="nav-item" href="#/subs" data-nav="subs" aria-label="내 구독"><canvas data-dither="bookmark" width="20" height="20" aria-hidden="true"></canvas><span>my</span></a>
    <button class="rail-add" data-external-search aria-label="GitHub에서 다른 저장소 찾기"><canvas data-dither="plus" width="20" height="20" aria-hidden="true"></canvas><span>add</span></button>
    <button class="search-toggle" data-search-open aria-label="수집된 저장소 검색" aria-expanded="false" aria-controls="collected-repository-search"><span data-lucide="search"></span></button>
    <div class="account-strip" id="account-strip"></div>
  </nav>
  <main class="desk">
    <canvas class="field" data-dither="field" data-color="--rule-strong" aria-hidden="true"></canvas>
    <span class="os-tag" aria-hidden="true">RB.OS1</span>
    <div id="view"></div>
  </main>
  <aside class="side" aria-label="진행 요약">
    <div id="stack" class="stack"></div>
  </aside>
</div>
<dialog id="repository-search" class="repository-search win" aria-labelledby="repository-search-title">
  <div class="win-bar"><span>GITHUB SEARCH</span><button type="button" data-search-dismiss aria-label="검색 닫기">×</button></div>
  <div class="win-body">
    <h2 id="repository-search-title">새로운 레포지토리 찾기</h2>
    <form role="search" aria-label="GitHub 저장소 검색">
      <input class="search" type="search" aria-label="GitHub 저장소 이름" placeholder="저장소 이름 또는 owner/repo" autocomplete="off" autofocus>
      <button class="ghost invert" type="submit">검색</button>
    </form>
    <p data-search-status role="status" aria-live="polite"></p>
    <div class="repository-search-content">
      <div class="repository-search-placeholder" data-search-placeholder>
        <canvas data-dither="plus" width="40" height="40" aria-hidden="true"></canvas>
        <b>어떤 저장소를 추가할까요?</b>
        <span>저장소 이름이나 owner/repo를 입력해 주세요.</span>
      </div>
      <div id="repository-search-loading" class="dialog search-loading" data-search-loading hidden role="status" aria-label="저장소 검색 중">
        <section class="win"><div class="win-bar"><span>RepoBite 1.0</span></div><div class="win-body">Loading ...<br>Repositories, Issues<div class="progress"><span style="width:0%">0%</span></div></div></section>
      </div>
      <div data-search-results></div>
    </div>
  </div>
</dialog>
<dialog id="detail" class="detail"></dialog>
<dialog id="onboard" class="onboard" aria-label="구독 설정"></dialog>
<div id="toasts" class="toasts" popover="manual" role="status" aria-live="polite"></div>
<div id="page-loading" class="dialog" role="status" aria-label="저장소와 이슈 불러오는 중">
  <section class="win"><div class="win-bar"><span>RepoBite 1.0</span></div><div class="win-body">Loading ...<br>Repositories, Issues<div class="progress"><span style="width:0%">0%</span></div></div></section>
</div>
<div id="save-loading" class="dialog" popover="manual" role="status" aria-label="구독 설정 저장 중">
  <section class="win"><div class="win-bar"><span>RepoBite 1.0</span></div><div class="win-body">Saving ...<br>Subscriptions, Mail<div class="progress"><span style="width:0%">0%</span></div></div></section>
</div>
<script src="/repobite-dither.js"></script>
<script type="module" src="/repobite-app.mjs"></script>
</body>
</html>
