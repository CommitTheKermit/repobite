<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore repositories | RepoBite</title>
<style>
:root{font:15px Inter,-apple-system,sans-serif;color:#f5f5f6;background:#09090b}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#09090b}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.rail{width:72px;flex:0 0 72px;padding:16px;border-right:1px solid #27272a}.mark{font-size:24px}.layout{display:flex;min-width:0;flex:1}.main{min-width:0;flex:1}.bar{display:flex;gap:8px;padding:20px 32px;position:sticky;top:0;background:#09090bf2;z-index:2}.sort,.chip,input{height:40px;border:1px solid #27272a;border-radius:12px;background:#09090b;color:#f5f5f6}.sort{width:144px;padding:0 12px}.chips{display:flex;gap:8px;overflow:auto}.chip{padding:0 14px;white-space:nowrap}.chip[aria-pressed=true]{background:#fafafa;border-color:#fafafa;color:#111}.feed{padding:8px 32px 32px;columns:3;column-gap:32px}.card{width:100%;margin:0 0 32px;padding:0;border:0;background:none;color:inherit;text-align:left;break-inside:avoid}.card[aria-pressed=true] .preview{outline:2px solid #fafafa;outline-offset:3px}.preview{position:relative;display:grid;min-height:230px;overflow:hidden;border:1px solid #27272a;border-radius:12px;background:#18181b}.preview>img,.fallback{grid-area:1/1}.preview>img{width:100%;height:100%;object-fit:cover}.preview>img.social,.preview>img.wide{height:auto;align-self:center;object-fit:contain}.fallback{align-self:center;justify-self:center;max-width:80%;color:#a1a1aa;font-size:18px;font-weight:700;overflow-wrap:anywhere;text-align:center}.stats{position:absolute;bottom:12px;left:12px;margin:0;padding:8px 10px;border:1px solid #27272a;border-radius:8px;background:#09090be8;font:11px monospace}.dot{display:inline-block;width:7px;height:7px;margin:0 4px 0 8px;border-radius:50%}.dot:first-child{margin-left:0}.e{background:#4ade80}.m{background:#facc15}.h{background:#fb7185}.meta{display:flex;gap:10px;padding-top:12px}.avatar{width:28px;height:28px;flex:0 0 28px;border:1px solid #27272a;border-radius:50%}.repo,.title{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.repo{font-weight:700}.title,.sub,.note{color:#a1a1aa;font-size:13px}.side{position:sticky;top:0;width:360px;height:100vh;overflow-y:auto;flex:0 0 360px;border-left:1px solid #27272a}.search{display:block;padding:20px 32px}.search input{width:100%;padding:0 14px}.panel{padding:0 32px 32px}.head{display:flex;justify-content:space-between;align-items:center}.head button{border:0;background:none;color:#a1a1aa}.repo-head{display:flex;gap:12px;margin:4px 0 20px}.repo-head h2{margin:0;font-size:16px}.repo-head p{margin:3px 0 0}.issues{padding:0;list-style:none}.issues li{display:flex;gap:10px;padding:14px 0;border-top:1px solid #27272a}.avatar-slot{width:30px;flex:0 0 30px}.issue-avatar{width:30px;height:30px;border-radius:50%}.copy{min-width:0}.copy a{display:-webkit-box;overflow:hidden;color:#f5f5f6;font-weight:650;line-height:1.35;text-decoration:none;-webkit-box-orient:vertical;-webkit-line-clamp:2}.copy a:hover{text-decoration:underline}.issue-meta{display:flex;flex-wrap:wrap;gap:5px 8px;margin-top:7px;color:#71717a;font-size:11px}.reason{margin:9px 0 0;padding-top:9px;border-top:1px solid #27272a;color:#a1a1aa;font-size:12px;line-height:1.45}.empty{color:#a1a1aa;padding:24px 0}@media(max-width:1199px){.side{display:none}}@media(max-width:900px){.feed{columns:2}}@media(max-width:767px){.rail{display:none}.bar{padding:12px}.feed{padding:8px 12px;columns:1}}

.rail button{display:grid;place-items:center;width:40px;height:40px;margin-top:28px;border:1px solid #3f3f46;border-radius:12px;background:#18181b;color:#fafafa;font-size:26px}.rail button:hover{background:#27272a}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fafafa;outline-offset:4px}.section-head{padding:12px 32px 0}.section-head h2{margin:0 0 8px;font-size:18px;font-weight:650}.section-head p{margin:0 0 16px}.community-section{border-bottom:1px solid #27272a;margin-bottom:20px}.community-section .feed{padding-bottom:0}.community-section .empty{margin-top:0;padding:8px 0 24px}.text-button{border:0;background:none;color:#fafafa;text-decoration:underline;padding:0}.community-section [role=status]{min-height:18px}dialog{width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #3f3f46;border-radius:16px;background:#18181b;color:#fafafa}dialog::backdrop{background:#000b}dialog h2{margin:0 0 12px;font-size:22px}dialog p{line-height:1.6}dialog label{display:block;margin:22px 0 8px;font-size:13px}dialog input{width:100%;padding:0 12px}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}dialog button{padding:10px 16px;border:1px solid #3f3f46;border-radius:10px;background:transparent;color:#fafafa}dialog button[type=submit]{background:#fafafa;color:#18181b}dialog button:disabled{opacity:.5;cursor:wait}.form-error{color:#fda4af;font-size:13px}.mobile-add{display:none}@media(max-width:767px){.section-head{padding:12px 12px 0}.mobile-add{display:inline-block;margin-left:12px}}
</style></head><body><div class="app"><nav class="rail" aria-label="주요 메뉴"><div class="mark" aria-label="RepoBite">◎</div><button type="button" id="add-repo" aria-label="레포 담기" title="레포 담기" aria-haspopup="dialog"><span aria-hidden="true">+</span></button></nav><div class="layout"><main class="main"><h1 hidden>오픈소스 레포지토리 탐색</h1><div class="bar"><select id="sort" class="sort" aria-label="정렬"><option value="recommended">추천순</option><option value="recent">최근 이슈순</option><option value="name">레포 이름순</option></select><div class="chips"><button class="chip" data-filter="" aria-pressed="true">전체 <span id="count">0</span></button><button class="chip" data-filter="ai-ml agents-automation">AI</button><button class="chip" data-filter="web-framework ui-design-system backend-api">프레임워크</button><button class="chip" data-filter="database search-knowledge">데이터</button><button class="chip" data-filter="dev-tools ide-terminal testing-quality cicd-release">개발 도구</button><button class="chip" data-filter="infra-cloud observability networking-systems">인프라</button><button class="chip" data-filter="security-identity">보안</button><button class="chip" data-filter="desktop-app mobile productivity">앱</button><button class="chip" data-filter="media-creative games-graphics">미디어</button></div></div><section class="community-section" aria-labelledby="community-heading"><div class="section-head"><h2 id="community-heading">사용자들이 추가한 레포<button type="button" id="mobile-add-repo" class="text-button mobile-add" aria-haspopup="dialog">+ 담기</button></h2><p class="note">함께 담은 레포를 다음 정기 수집부터 살펴봅니다.</p><p id="community-status" class="note" role="status">공용 목록을 불러오는 중입니다.</p><p><button id="retry-community" class="text-button" hidden>다시 불러오기</button></p></div><div id="community-feed" class="feed"></div></section><div class="section-head"><h2>기본 수집 레포</h2></div><section id="feed" class="feed" aria-label="레포지토리"></section></main><aside class="side"><label class="search"><input id="search" type="search" placeholder="Search repositories..." aria-label="레포지토리 검색"></label><section class="panel"><div class="head"><div id="heading">Recent issues</div><button id="clear" hidden>전체 보기</button></div><ul id="issues" class="issues"></ul><p class="note">수집과 판정 결과를 바탕으로 레포와 이슈를 탐색합니다.</p></section></aside></div></div>
<dialog id="repo-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description"><form id="repo-form"><h2 id="dialog-title">관심 있는 레포 담기</h2><p id="dialog-description" class="note">추가한 레포는 모두에게 공유됩니다.<br>이슈는 다음 정기 수집이 끝나면 표시됩니다.</p><label for="repo-input">GitHub 레포 주소</label><input id="repo-input" name="repo" required maxlength="250" placeholder="https://github.com/owner/repo" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="repo-error"><p id="repo-error" class="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel-repo">취소</button><button type="submit" id="submit-repo">레포 담기</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),make=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};let state={items:[]},tags=[],selected='',query='',sort='recommended';let submitted=[],collected=new Set,communityAvailable=false;const cardCache=new Map,good=x=>x.grade&&!x.grade.exclude&&x.grade.difficulty===1&&x.grade.readiness==='ready'&&x.freshness?.eligible;
function allRepos(){let m=new Map;state.items.forEach(x=>{let key=x.repo.toLowerCase();if(!m.has(key))m.set(key,{...x,issues:[]});m.get(key).issues.push(x)});submitted.forEach(x=>{let key=x.repo.toLowerCase(),r=m.get(key)||{...x,categories:[],issues:[]};m.set(key,{...r,description:x.description||r.description,community:true})});return [...m.values()]}
function matches(r){return(!tags.length||r.categories.some(t=>tags.includes(t)))&&(r.repo+' '+r.description).toLowerCase().includes(query.toLowerCase())}
function repos(){return allRepos().filter(matches).sort((a,b)=>sort==='name'?a.repo.localeCompare(b.repo):sort==='recent'?new Date(b.issues[0]?.created_at||0)-new Date(a.issues[0]?.created_at||0):b.issues.filter(good).length-a.issues.filter(good).length)}
function repoStatus(r){return r.issues.length?'이슈 '+r.issues.length+'개':collected.has(r.repo.toLowerCase())?'수집 완료 · 조건에 맞는 이슈 없음':'수집 대기'}
function cards(){let list=repos();$('count').textContent=allRepos().length;renderCards(list.filter(r=>r.community),$('community-feed'));renderCards(list.filter(r=>!r.community),$('feed'))}
function renderCards(list,feed){feed.replaceChildren();if(!list.length)return feed.append(make('p','empty',feed.id==='community-feed'&&!submitted.length?(communityAvailable?'아직 추가한 레포가 없습니다. 관심 있는 레포를 담아보세요.':'공용 목록을 다시 불러와주세요.'):'일치하는 레포가 없습니다.'));list.forEach(r=>{let b=cardCache.get(r.repo);if(!b){b=make('button','card');b.type='button';b.dataset.repo=r.repo;let owner=r.repo.split('/')[0],p=make('div','preview'),fallback=make('span','fallback',r.repo),social='https://opengraph.githubassets.com/1/'+r.repo,img=make('img',r.repository_image?'':'social');fallback.hidden=true;img.src=r.repository_image||social;img.alt=r.repo+' 대표 이미지';img.onload=()=>requestAnimationFrame(()=>img.classList.toggle('wide',img.naturalWidth*p.clientHeight>img.naturalHeight*p.clientWidth));img.onerror=()=>{if(!img.classList.contains('social')){img.className='social';img.src=social}else{img.hidden=true;fallback.hidden=false}};p.append(fallback,img);let levels=[1,2,3].map(n=>r.issues.filter(x=>x.grade?.difficulty===n).length),stats=make('p','stats');stats.setAttribute('aria-label','쉬움 '+levels[0]+', 중간 '+levels[1]+', 어려움 '+levels[2]);[['e',0],['m',1],['h',2]].forEach(([c,n])=>stats.append(make('span','dot '+c),document.createTextNode(levels[n])));if(!r.issues.length){stats.textContent=repoStatus(r);stats.setAttribute('aria-label',repoStatus(r))}p.append(stats);let meta=make('div','meta'),av=make('img','avatar');av.src='https://avatars.githubusercontent.com/'+owner+'?v=4&s=128';av.alt='';av.onerror=()=>av.hidden=true;meta.append(av);let text=make('p');text.append(make('span','repo',r.repo),make('span','title',r.description));meta.append(text);b.append(p,meta);b.onclick=()=>{selected=selected===r.repo?'':r.repo;document.querySelectorAll('.card').forEach(x=>x.setAttribute('aria-pressed',x.dataset.repo===selected));issues()};cardCache.set(r.repo,b)}b.setAttribute('aria-pressed',r.repo===selected);feed.append(b)})}
function verdict(x){if(x.error)return'판정 실패';if(!x.grade)return'미판정';if(x.grade.exclude)return'제외';return({ready:'바로 착수',needs_info:'확인 필요',undecided:'판단 보류'})[x.grade.readiness]||'판단 보류'}
function issues(){let rows=selected?state.items.filter(x=>x.repo.toLowerCase()===selected.toLowerCase()):[...state.items].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8),head=$('heading');head.replaceChildren();if(selected){let r=allRepos().find(x=>x.repo.toLowerCase()===selected.toLowerCase()),box=make('div','repo-head'),av=make('img','avatar'),text=make('div');av.src='https://avatars.githubusercontent.com/'+selected.split('/')[0]+'?v=4&s=128';av.alt='';av.onerror=()=>av.hidden=true;text.append(make('h2','',selected),make('p','sub',r.description+' · '+repoStatus(r)));box.append(av,text);head.append(box)}else head.textContent='Recent issues';$('clear').hidden=!selected;$('issues').replaceChildren();rows.forEach(x=>{let li=make('li'),slot=make('span','avatar-slot'),av=make('img','issue-avatar'),copy=make('div','copy'),a=make('a','',x.title),meta=make('div','issue-meta');av.src=x.user?'https://avatars.githubusercontent.com/'+x.user+'?v=4&s=80':'';av.alt='';if(!x.user)av.hidden=true;av.onerror=()=>av.hidden=true;slot.append(av);a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';meta.append(make('span','',x.user?'@'+x.user:'작성자 미상'),make('span','',x.created_at.slice(5,10).replace('-','.')),make('span','',x.grade?.difficulty?'난이도 '+x.grade.difficulty:'난이도 미정'),make('span','',verdict(x)));copy.append(a,meta);if(x.grade?.reason)copy.append(make('p','reason',x.grade.reason));li.append(slot,copy);$('issues').append(li)});if(!rows.length)$('issues').append(make('li','empty',selected?repoStatus(allRepos().find(x=>x.repo.toLowerCase()===selected.toLowerCase())):'표시할 이슈가 없습니다.'))}
async function readJSON(url,options){let r=await fetch(url,options),d;try{d=await r.json()}catch{throw Error('서비스에 연결하지 못했습니다. 잠시 후 다시 시도하세요.')}if(!r.ok)throw Error(d.error||'요청에 실패했습니다.');return d}
async function refresh(){let [base,shared]=await Promise.allSettled([readJSON('/data.json'),readJSON('/api/repos')]);if(base.status==='fulfilled')state=base.value;if(shared.status==='fulfilled'){communityAvailable=true;submitted=shared.value.repos;if(shared.value.snapshot){state=shared.value.snapshot;collected=new Set(state.collected_repos||[])}$('community-status').textContent='';$('retry-community').hidden=true}else{$('community-status').textContent='공용 목록을 불러오지 못했습니다.';$('retry-community').hidden=false}if(selected&&!allRepos().some(r=>r.repo===selected))selected='';cardCache.clear();cards();issues();if(base.status==='rejected'&&(shared.status==='rejected'||!shared.value.snapshot))$('feed').replaceChildren(make('p','empty','레포 목록을 불러오지 못했습니다. 다시 불러오기를 눌러주세요.'))}
function openRepoDialog(){$('repo-error').textContent='';$('repo-dialog').showModal()}
$('add-repo').onclick=openRepoDialog;$('mobile-add-repo').onclick=openRepoDialog;
$('cancel-repo').onclick=()=>$('repo-dialog').close();$('retry-community').onclick=refresh;
$('repo-form').onsubmit=async e=>{e.preventDefault();$('submit-repo').disabled=true;$('cancel-repo').disabled=true;$('repo-error').textContent='';$('submit-repo').textContent='확인 중…';try{let result=await readJSON('/api/repos',{method:'POST',headers:{'Content-Type':'application/json','X-Radar-Request':'1'},body:JSON.stringify({repo:$('repo-input').value})});if(!result.default){submitted=submitted.filter(r=>r.repo.toLowerCase()!==result.repo.repo.toLowerCase());submitted.unshift(result.repo)}tags=[];query='';selected='';$('search').value='';document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===''));cardCache.clear();cards();issues();$('community-status').textContent=result.default?'이미 기본 목록에서 수집하는 레포입니다.':result.created?'레포를 담았습니다. 다음 정기 수집부터 반영됩니다.':'이미 담긴 레포입니다.';$('repo-dialog').close();$('repo-form').reset();$('community-heading').scrollIntoView({block:'start'})}catch(error){$('repo-error').textContent=error.message||'등록하지 못했습니다. 다시 시도하세요.'}finally{$('submit-repo').disabled=false;$('cancel-repo').disabled=false;$('submit-repo').textContent='레포 담기'}};
$('repo-dialog').addEventListener('cancel',e=>{if($('submit-repo').disabled)e.preventDefault()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{tags=b.dataset.filter.split(' ').filter(Boolean);selected='';document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));cards();issues()});$('search').oninput=e=>{query=e.target.value;selected='';cards();issues()};$('sort').onchange=e=>{sort=e.target.value;cards()};$('clear').onclick=()=>{selected='';cards();issues()};refresh().catch(e=>$('feed').append(make('p','empty',e.message)));
</script></body></html>
