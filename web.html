<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepoBite</title>


<link rel="stylesheet" href="/repobite.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="주요 메뉴">
    <a class="mark" href="#/explore" aria-label="RepoBite 메인으로"><canvas data-dither="logo" width="20" height="20" aria-hidden="true"></canvas></a>
    <a class="nav-item" href="#/explore" data-nav="explore" aria-label="탐색"><canvas data-dither="compass" width="20" height="20" aria-hidden="true"></canvas><span>explore</span></a>
    <a class="nav-item" href="#/subs" data-nav="subs" aria-label="내 구독"><canvas data-dither="bookmark" width="20" height="20" aria-hidden="true"></canvas><span>my</span></a>
    <button class="rail-search" data-search-open aria-label="저장소 검색"><span data-lucide="search"></span></button>
  </nav>
  <main class="desk">
    <canvas class="field" data-dither="field" data-color="--rule-strong" aria-hidden="true"></canvas>
    <span class="os-tag" aria-hidden="true">RB.OS1</span>
    <div class="account-strip" id="account-strip" role="status"></div>
    <div id="view"></div>
  </main>
  <aside class="side" aria-label="진행 요약">
    <div id="stack" class="stack"></div>
  </aside>
</div>
<dialog id="repository-search" class="repository-search win" aria-labelledby="repository-search-title" aria-describedby="repository-search-description">
  <div class="win-bar"><span>GITHUB SEARCH</span><button type="button" data-search-dismiss aria-label="검색 닫기">×</button></div>
  <div class="win-body">
    <h2 id="repository-search-title">새로운 레포지토리 찾기</h2>
    <p id="repository-search-description">GitHub의 공개 저장소를 찾아보세요. 구독하면 해당 저장소의 이슈를 바로 수집합니다.</p>
    <form role="search" aria-label="GitHub 저장소 검색">
      <input class="search" type="search" aria-label="GitHub 저장소 이름" placeholder="저장소 이름 또는 owner/repo" autocomplete="off" autofocus>
      <button class="ghost invert" type="submit">검색</button>
    </form>
    <p data-search-status role="status" aria-live="polite"></p>
    <div data-search-results></div>
  </div>
</dialog>
<dialog id="detail" class="detail"></dialog>
<dialog id="onboard" class="onboard" aria-label="구독 설정"></dialog>
<div id="toasts" class="toasts" popover="manual" role="status" aria-live="polite"></div>
<script src="/repobite-dither.js"></script>
<script type="module" src="/repobite-app.mjs"></script>
</body>
</html>
